name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Minimal permissions block — prevents unexpected permission-related startup failures
permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Repository status
        run: |
          echo "MELISA / repo CI is healthy"
          echo "Repo: ${{ github.repository }}"
          echo "Ref:  ${{ github.ref }}"
